<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유해·위험방지계획서 제출 대상 확인</title>
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--text:#1b1f24;--muted:#4b5563;--line:#cfd5dd;
  --primary:#0b57d0;--primary-text:#fff;
  --target-bg:#fdecec;--target-line:#b42318;--target-text:#7a1810;
  --unknown-bg:#fff4d6;--unknown-line:#a15c00;--unknown-text:#5c3500;
  --neutral-bg:#eef1f5;--neutral-line:#6b7280;--neutral-text:#1f2933;
  --focus:#0b57d0;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:1.5rem;line-height:1.35;margin:8px 0 12px}
h2{font-size:1.25rem;line-height:1.4;margin:4px 0 12px}
h3{font-size:1.05rem;margin:0 0 8px}
h4{font-size:1rem;margin:0 0 6px}
h5{font-size:.95rem;margin:8px 0 4px}
h1:focus,h2:focus,#errsum:focus{outline:none}
h1:focus-visible,h2:focus-visible,#errsum:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
p{margin:0 0 10px}
.lead{font-weight:600}
.muted{color:var(--muted);font-size:.95rem}
.scope{color:var(--muted);font-size:.9rem;border-top:1px solid var(--line);padding-top:10px;margin-top:20px}
.stepno{color:var(--muted);font-size:.9rem;margin:0}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
fieldset.group{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;margin:0 0 14px}
fieldset.group legend{font-weight:700;padding:0 6px}
.opt{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 4px;cursor:pointer}
.opt input{width:22px;height:22px;flex:none;accent-color:var(--primary)}
.sep{border:0;border-top:1px dashed var(--line);margin:8px 0}
.field{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 14px}
.field .q{display:block;font-weight:700;margin-bottom:8px}
.row{display:flex;align-items:center;gap:8px}
input[type=text],select{width:100%;min-height:44px;font:inherit;padding:8px 10px;border:1px solid #6b7280;border-radius:8px;background:#fff;color:var(--text)}
input[type=text]:disabled,select:disabled{background:#eceff3;color:#6b7280}
.unit{white-space:nowrap;color:var(--muted)}
.sub{margin:0 0 6px 36px}
.has-error{border-color:var(--target-line)!important;border-width:2px}
.err{color:var(--target-text);font-weight:600;margin:6px 0 0}
.errsum{background:var(--target-bg);border:2px solid var(--target-line);color:var(--target-text);border-radius:10px;padding:10px 14px;margin:0 0 14px}
.errsum ul{margin:6px 0 0;padding-left:20px}
.errsum a{color:var(--target-text);text-decoration:underline;min-height:44px;display:inline-block}
.subsec{margin:0 0 6px}
.nav{position:sticky;bottom:0;display:flex;justify-content:space-between;gap:12px;background:linear-gradient(to top,var(--bg) 75%,rgba(246,247,249,0));padding:16px 0 12px;margin-top:12px}
.btn{min-height:48px;min-width:96px;padding:10px 18px;font:inherit;font-weight:700;border-radius:10px;border:2px solid var(--primary);background:#fff;color:var(--primary);cursor:pointer}
.btn.primary{background:var(--primary);color:var(--primary-text)}
.btn:focus-visible,.link:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.link{background:none;border:0;color:var(--primary);text-decoration:underline;font:inherit;min-height:44px;padding:0 6px;cursor:pointer}
.headline{display:flex;gap:12px;align-items:flex-start;border:2px solid;border-radius:12px;padding:14px 16px;margin:6px 0 14px}
.headline .ico{font-size:1.4rem;line-height:1.3}
.headline h2{margin:0}
.headline .sub{margin:6px 0 0;font-weight:700}
.tone-target{background:var(--target-bg);border-color:var(--target-line);color:var(--target-text)}
.tone-unknown{background:var(--unknown-bg);border-color:var(--unknown-line);color:var(--unknown-text)}
.tone-neutral,.tone-nontarget,.tone-error{background:var(--neutral-bg);border-color:var(--neutral-line);color:var(--neutral-text)}
.block{margin:0 0 18px}
.block.tone-unknown{border:2px solid var(--unknown-line);border-radius:10px;padding:12px 14px}
.confirm{margin:0;padding-left:20px}
.confirm li{margin-bottom:4px}
.card{border:1px solid;border-left-width:6px;border-radius:10px;padding:10px 14px;margin:0 0 10px}
.callout{border:2px solid;border-radius:10px;padding:10px 14px;margin:8px 0 12px}
.callout p:last-child{margin-bottom:0}
.badge{display:inline-block;white-space:nowrap;flex:none;font-weight:700;padding:2px 10px;border-radius:999px;border:1px solid;font-size:.95rem}
.badge.tone-target{background:var(--target-bg)}
.rows{list-style:none;margin:6px 0;padding:0}
.rows li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.path{margin:8px 0}
.basis{margin-top:8px}
.basis summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700;color:var(--primary)}
.basis ul{padding-left:18px;margin:6px 0}
.basis li{margin-bottom:8px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>

'./engine.js': function (module, exports, require) {
/**
 * engine.js
 *
 * RULE-CONTRACT.md(승인됨: 2026-09-25)를 코드로 옮긴 Pure Engine.
 *
 * 반드시 지키는 것 (RULE-CONTRACT.md / STEP 5 지시 그대로):
 *  - DOM을 읽거나 쓰지 않는다.
 *  - localStorage/네트워크를 쓰지 않는다.
 *  - 현재 시간에 의존하지 않는다 — evaluate()가 만드는 snapshot에
 *    시각 정보가 필요하면 호출자가 meta.now로 명시적으로 넘긴다.
 *  - 전역 mutable state가 없다. 이전 실행 결과를 내부에 저장하지 않는다.
 *  - 동일 input이면 항상 동일 snapshot (determinism).
 *
 * 상태 3분류 (RULE-CONTRACT.md "결과 상태" 절):
 *   TARGET / NOT_TARGET / UNKNOWN
 * 적용범위 2분류 (같은 절 + "N/A vs NOT_TARGET" 절):
 *   APPLICABLE / NOT_APPLICABLE_TO_WORK_TYPE
 * 이 둘은 절대 하나의 boolean으로 축약하지 않는다 (Invariant 3, 6).
 */
'use strict';

const { LAW_BASIS, INDUSTRY_LIST, RULE_VERSION } = require('./law-basis.js');
const { THRESHOLDS, WORK_TYPE } = require('./data.js');

const ENGINE_VERSION = '0.2.0';

const STATUS = Object.freeze({
  TARGET: 'TARGET',
  NOT_TARGET: 'NOT_TARGET',
  UNKNOWN: 'UNKNOWN',
});

const APPLICABILITY = Object.freeze({
  APPLICABLE: 'APPLICABLE',
  NOT_APPLICABLE_TO_WORK_TYPE: 'NOT_APPLICABLE_TO_WORK_TYPE',
});

// ---------------------------------------------------------------------------
// 3치 논리 (three-valued logic) 헬퍼
//
// 조건 하나하나는 true(충족) | false(불충족) | undefined(모름)로 표현한다.
// AND: 하나라도 false면 전체 false(다른 조건이 unknown이어도 확정 가능).
//      전부 true면 true. 그 외(false는 없고 unknown이 하나라도 있음)는 unknown.
// OR:  하나라도 true면 전체 true. 전부 false면 false. 그 외는 unknown.
// 이 논리가 UNKNOWN이 NOT_TARGET으로 조기 확정되지 않게 하는 핵심 장치다
// (RULE-CONTRACT.md "절대 규칙(fail-closed)").
// ---------------------------------------------------------------------------

function and3(...conditions) {
  if (conditions.some((c) => c === false)) return false;
  if (conditions.every((c) => c === true)) return true;
  return undefined;
}

function or3(...conditions) {
  if (conditions.some((c) => c === true)) return true;
  if (conditions.every((c) => c === false)) return false;
  return undefined;
}

function toStatus(threeValued) {
  if (threeValued === true) return STATUS.TARGET;
  if (threeValued === false) return STATUS.NOT_TARGET;
  return STATUS.UNKNOWN;
}

// 숫자 비교를 3치 논리로: 값이 없으면 unknown, 있으면 실제 비교.
function gte(value, threshold) {
  if (value === undefined || value === null || Number.isNaN(value)) return undefined;
  return value >= threshold;
}

// ---------------------------------------------------------------------------
// 모듈 1 — 사업장 기준 (RULE-CONTRACT.md ## 판정 모듈 1)
// ---------------------------------------------------------------------------

function evaluateModule1(input) {
  const industryMatch = input.businessType && input.businessType.withinListedIndustries;
  const capacityMet = gte(input.contractCapacityKw, THRESHOLDS.CONTRACT_CAPACITY_KW);

  const conditionIndustry = industryMatch === undefined ? undefined : Boolean(industryMatch);
  const three = and3(conditionIndustry, capacityMet);
  const status = toStatus(three);

  // 재사용한다 (RULE-CONTRACT.md "applicability(작업형태 범위) 명시" 절).
  const applicability =
    input.workType === WORK_TYPE.NEW || input.workType === WORK_TYPE.FULL_RELOCATION
      ? APPLICABILITY.APPLICABLE
      : APPLICABILITY.NOT_APPLICABLE_TO_WORK_TYPE;

  return {
    ruleId: 'M1',
    status,
    applicability,
    legalBasis: [LAW_BASIS.DECREE_42_1.ruleId],
    reason: describeModule1(conditionIndustry, input.contractCapacityKw),
    inputsUsed: {
      withinListedIndustries: conditionIndustry,
      contractCapacityKw: input.contractCapacityKw,
    },
  };
}

function describeModule1(conditionIndustry, capacityKw) {
  if (conditionIndustry === undefined || capacityKw === undefined) {
    return '업종 또는 계약용량 정보가 없어 판단할 수 없음';
  }

    ? `13개 대상 업종 해당 + 계약용량 ${capacityKw}kW (>= ${THRESHOLDS.CONTRACT_CAPACITY_KW}kW)`

// ---------------------------------------------------------------------------
// 모듈 2 — 증설·교체·개조 (RULE-CONTRACT.md ## 판정 모듈 2)
// ---------------------------------------------------------------------------

function evaluateModule2(input, module1Result) {
  const applicability =
    input.workType === WORK_TYPE.MODIFICATION
      ? APPLICABILITY.APPLICABLE
      : APPLICABILITY.NOT_APPLICABLE_TO_WORK_TYPE;

  // 선행조건: 모듈1의 status를 그대로 재사용한다(모듈1의 applicability와는
  // 무관 — 증설 작업에서 모듈1은 NOT_APPLICABLE_TO_WORK_TYPE이어도 그
  // status(TARGET/NOT_TARGET/UNKNOWN)는 여기서 그대로 쓴다).
  const precondition = statusToThreeValued(module1Result.status);

  // [증설·교체·개조]로 선택한 것 자체가 그 사실을 구성한다고 본다 —
  // RULE-CONTRACT.md는 이를 별도 입력 항목으로 두지 않았다.
  const three = and3(precondition, capacityMet);
  const status = toStatus(three);

  return {
    ruleId: 'M2',
    status,
    applicability,
    legalBasis: [LAW_BASIS.NOTICE_2_1_5_GA.ruleId],
    reason: describeModule2(precondition, netIncreaseKw),
    inputsUsed: {
      module1Precondition: module1Result.status,
      grossRatedCapacityIncreaseKw: input.module2 && input.module2.grossRatedCapacityIncreaseKw,
      sameManufacturerSameModelExcludedKw:
        input.module2 && input.module2.sameManufacturerSameModelExcludedKw,
      netRatedCapacityIncreaseKw: netIncreaseKw,
    },
  };
}

// "동일 제조사·동일 모델 제외" 예외(NOTICE_2_1_5_GA)를 반영해 순증가분을 계산.
// 이 계산은 반드시 여기서만 일어난다 — UI가 이 뺄셈을 대신 하지 않는다.
function computeModule2NetIncrease(m2) {
  if (!m2 || m2.grossRatedCapacityIncreaseKw === undefined) return undefined;
  const excluded = m2.sameManufacturerSameModelExcludedKw || 0;
  return m2.grossRatedCapacityIncreaseKw - excluded;
}

function describeModule2(precondition, netIncreaseKw) {
  if (precondition === undefined) return '모듈1(사업장 기준) 확정 전이라 판단 불가';
  if (precondition === false) return '모듈1(사업장 기준) 조건 불충족 사업장';
  if (netIncreaseKw === undefined) return '정격용량 증가분 정보가 없어 판단할 수 없음';

// 모듈 3 — 이설 (RULE-CONTRACT.md ## 판정 모듈 3, 세션4 3차 재감사로 전제조건 추가)

  const three = and3(precondition, relocatedCapacityMet);

    ruleId: 'M3',
    status,
    applicability,
    legalBasis: [LAW_BASIS.NOTICE_2_1_5_NA.ruleId],
    reason: describeModule3(precondition, input.module3 && input.module3.relocatedRatedCapacityKw),
    inputsUsed: {
      module1Precondition: module1Result.status,
      relocatedRatedCapacityKw: input.module3 && input.module3.relocatedRatedCapacityKw,
    },
  };
}

function describeModule3(precondition, capacityKw) {
  if (precondition === undefined) return '모듈1(사업장 기준) 확정 전이라 판단 불가';
  if (precondition === false) return '모듈1(사업장 기준) 조건 불충족 사업장';
  if (capacityKw === undefined) return '이설 설비 정격용량 정보가 없어 판단할 수 없음';

}

  if (status === STATUS.NOT_TARGET) return false;
  return undefined;
}

//
// 세션5에서 법 제42조제1항제2호 원문("설치·이전하거나 그 주요 구조부분을
// 변경하려는 경우")을 확보해 OPEN-ISSUE-M4-1을 해소했다. 모듈4는 작업형태에
// 따라 배타적으로 다른 경로를 평가한다(모듈1~3과 동일한 패턴):
//   - 신설/전체이전 → M4-설치/이전 (NOTICE_3 기준표)
//   - 증설·교체·개조 → M4-주요구조부분변경 (NOTICE_2_1_6 가~마목)
//   - 이설(부분이전) → 법적 근거 미확정(OPEN-ISSUE-M4-RELOCATION-PARTIAL) → UNKNOWN
// 두 경로를 동시에 계산해 OR로 합치지 않는다 — 현재 작업형태에 해당하는
// 경로만 평가한다(검토자 지적: workType이 MODIFICATION인데 input.equipment가
// 기준표를 충족한다고 해서 설치경로가 TARGET에 기여하면 안 됨).
// ---------------------------------------------------------------------------

function evaluateModule4(input) {
  const installation = evaluateM4Installation(input.equipment, input.workType);
  const modification = evaluateM4Modification(input.equipmentChange, input.workType);

  let status;
  if (input.workType === WORK_TYPE.NEW || input.workType === WORK_TYPE.FULL_RELOCATION) {
    status = installation.status;
  } else if (input.workType === WORK_TYPE.MODIFICATION) {
    status = modification.status;
  } else if (input.workType === WORK_TYPE.PARTIAL_RELOCATION) {
    // OPEN-ISSUE-M4-RELOCATION-PARTIAL: 법적 근거 미확정 — 추측해서
    // TARGET/NOT_TARGET을 만들지 않는다. 항상 UNKNOWN.
    status = STATUS.UNKNOWN;
  } else {
    status = STATUS.UNKNOWN;
  }

  const reason = describeModule4(input.workType, status, installation, modification);

  return {
    ruleId: 'M4',
    status,
    applicability: APPLICABILITY.APPLICABLE, // 모듈4는 항상 독립 평가 — applicability 분기 없음
    legalBasis: [LAW_BASIS.DECREE_42_2.ruleId],
    reason,
    paths: { installation, modification },
    unresolvedLegalIssue:
      input.workType === WORK_TYPE.PARTIAL_RELOCATION ? 'OPEN-ISSUE-M4-RELOCATION-PARTIAL' : undefined,
  };
}

function describeModule4(workType, status, installation, modification) {
  if (workType === WORK_TYPE.PARTIAL_RELOCATION) {
    return '이설(부분이전) 시 모듈4 판정기준이 RULE-CONTRACT.md에 미확정 — OPEN-ISSUE-M4-RELOCATION-PARTIAL';
  }
  const path = workType === WORK_TYPE.MODIFICATION ? modification : installation;
  if (status === STATUS.TARGET) {
    const hit = Object.entries(path.equipmentResults || {}).find(([, r]) => r && r.three === true);
    return hit ? `${hit[0]}: ${hit[1].reason}` : '대상설비 조건 충족';
  }
  if (status === STATUS.UNKNOWN) return '대상설비 세부조건 일부 미입력';
  return '입력된 대상설비 전부 조건 불충족';
}

// ---------------------------------------------------------------------------
// M4-설치/이전 — 고시 제3조 기준표 (신설/전체이전에만 적용)
// ---------------------------------------------------------------------------

function evaluateM4Installation(eq, workType) {
  const applicability =
    workType === WORK_TYPE.NEW || workType === WORK_TYPE.FULL_RELOCATION
      ? APPLICABILITY.APPLICABLE
      : APPLICABILITY.NOT_APPLICABLE_TO_WORK_TYPE;

  if (applicability !== APPLICABILITY.APPLICABLE) {
    return { ruleId: 'M4-INSTALL', status: STATUS.NOT_TARGET, applicability, equipmentResults: {} };
  }

  // STEP4 자체를 아직 안 받은 경우(화면에 도달 안 함) 전체가 UNKNOWN.
  if (eq === undefined) {
    return {
      ruleId: 'M4-INSTALL',
      status: STATUS.UNKNOWN,
      applicability,
      equipmentResults: {},
      reason: '대상설비 해당 여부 정보가 없어 판단할 수 없음',
    };
  }
  // 사용자가 "없음"을 명시적으로 답한 경우 — 확정된 정보이므로 NOT_TARGET.
  if (eq.none === true) {
    return {
      ruleId: 'M4-INSTALL',
      status: STATUS.NOT_TARGET,
      applicability,
      equipmentResults: {},
      reason: '대상설비 없음으로 확인됨',
    };
  }

  const equipmentResults = {
    meltingFurnace: evaluateMeltingFurnace_Installation(eq.meltingFurnace),
    chemicalEquipment: evaluateChemicalEquipment_Installation(eq.chemicalEquipment),
    dryingEquipment: evaluateDryingEquipment_Installation(eq.dryingEquipment),
    gasWeldingAssembly: evaluateGasWeldingAssembly_Installation(eq.gasWeldingAssembly),
    ventilation: evaluateVentilation_Installation(eq.ventilation),
  };

  const three = or3(
    equipmentResults.meltingFurnace.three,
    equipmentResults.chemicalEquipment.three,
    equipmentResults.dryingEquipment.three,
    equipmentResults.gasWeldingAssembly.three,
    equipmentResults.ventilation.three
  );

  return {
    ruleId: 'M4-INSTALL',
    status: toStatus(three),
    applicability,
    legalBasis: [LAW_BASIS.NOTICE_3.ruleId, LAW_BASIS.NOTICE_2_4.ruleId],
    equipmentResults,
  };
}

// 각 설비 평가 함수 — evaluateXxx_Installation(), 법적 규칙 단위로 분리
// (STEP 5 지시 11번). eq가 present!==true(선택 안 함)면 그 설비는 논의 대상이
// 아니므로 3치 결과는 false(그 설비로 인한 TARGET 사유는 없음)로 취급한다.
// present는 true인데 세부 수치가 없으면 unknown.

function evaluateMeltingFurnace_Installation(eq) {
  if (!eq || eq.present !== true) {
    return { three: false, reason: '해당 없음' };
  }
  const three = gte(eq.capacityTon, THRESHOLDS.EQUIPMENT_MELTING_FURNACE_TON);
  return {
    three,
    reason:
      three === undefined
        ? '용량 정보 없음'
        : `용해로 ${eq.capacityTon}톤 (기준 ${THRESHOLDS.EQUIPMENT_MELTING_FURNACE_TON}톤)`,
  };
}

function evaluateChemicalEquipment_Installation(eq) {
  if (!eq || eq.present !== true) {
    return { three: false, reason: '해당 없음' };
  }
  // OPEN-ISSUE(별표9): 안전보건규칙 별표9 물질별 기준량 수치는 이 저장소
  // 범위 밖 — 호출자가 판정한 boolean만 받는다(law-basis.js NOTICE_3.openItems
  // 참고). 시행령 제43조제2항 제외설비 여부(excludedByDecree43_2)는 세션5에서
  // 근거가 확정됐다(DECREE_43_2 참고) — "시행령 제43조제2항에서 정한 설비에
  // 해당하여 고시 제3조제2호의 화학설비 대상에서 제외되는가?"를 의미한다.
  const meetsThreshold = eq.meetsHazardousSubstanceThreshold; // boolean | undefined
  const excluded = eq.excludedByDecree43_2 === true;

  if (excluded) {
    return { three: false, reason: '시행령 제43조제2항 제외설비로 확인됨(고시 제3조제2호 단서)' };
  }
  return {
    three: meetsThreshold === undefined ? undefined : Boolean(meetsThreshold),
    reason:
      meetsThreshold === undefined
        ? '위험물질 기준량 충족 여부 미확인(별표9 수치는 이 저장소 범위 밖)'
        : meetsThreshold
        ? '안전보건규칙 별표9 위험물질 기준량 충족'
        : '안전보건규칙 별표9 위험물질 기준량 미충족',
  };
}

function evaluateDryingEquipment_Installation(eq) {
  if (!eq || eq.present !== true) {
    return { three: false, reason: '해당 없음' };
  }
  const sizeCondition = or3(
    gte(eq.fuelConsumptionKgPerHour, THRESHOLDS.EQUIPMENT_DRYING_FUEL_KG_PER_HOUR),
    gte(eq.ratedPowerKw, THRESHOLDS.EQUIPMENT_DRYING_RATED_POWER_KW)
  );
  const purposeCondition = isValidDryingPurpose(eq.purpose);

  const three = and3(sizeCondition, purposeCondition);
  return {
    three,
    reason:
      three === undefined
        ? '연료소비량/정격소비전력 또는 건조목적 정보 없음'
        : `건조설비 규모+목적 조건 ${three ? '충족' : '불충족'}`,
  };
}

function evaluateGasWeldingAssembly_Installation(eq) {
  if (!eq || eq.present !== true) {
    return { three: false, reason: '해당 없음' };
  }
  const three = and3(
    gte(eq.flammableGasQuantityKg, THRESHOLDS.EQUIPMENT_GAS_WELDING_ASSEMBLY_KG),
    eq.isFixed === undefined ? undefined : Boolean(eq.isFixed)
  );
  return {
    three,
    reason:
      three === undefined
        ? '인화성가스 집합량 또는 고정식 여부 정보 없음'
        : `인화성가스 ${eq.flammableGasQuantityKg}kg, 고정식 ${eq.isFixed ? 'O' : 'X'} (기준 ${THRESHOLDS.EQUIPMENT_GAS_WELDING_ASSEMBLY_KG}kg)`,
  };
}

function evaluateVentilation_Installation(eq) {
  if (!eq || eq.present !== true) {
    return { three: false, reason: '해당 없음' };
  }
  if (eq.substanceCategory === undefined || eq.exhaustAirVolumeM3PerMin === undefined) {
    return { three: undefined, reason: '물질 구분 또는 배풍량 정보 없음' };
  }
  const threshold =
    eq.substanceCategory === 'NOTICE_TABLE1_ITEM7'
      ? THRESHOLDS.EQUIPMENT_VENTILATION_NOTICE_TABLE1_ITEM7_M3_PER_MIN
      : THRESHOLDS.EQUIPMENT_VENTILATION_PERMIT_OR_MANAGED_OR_DUST_M3_PER_MIN;
  const three = eq.exhaustAirVolumeM3PerMin >= threshold;
  return { three, reason: `배풍량 ${eq.exhaustAirVolumeM3PerMin}㎥/분 (기준 ${threshold}㎥/분)` };
}

// 건조설비의 "목적" 값이 고시 제3조제3호 각목(유기화합물건조/도료피막코팅표면
// 건조/가연성분말분진) 중 하나에 해당하는지 — M4-설치와 M4-변경(경로B) 둘 다
// 이 함수를 공유한다(제3조제3호 "목적분류"는 재사용, 크기기준은 재사용 안 함).
function isValidDryingPurpose(purpose) {
  if (purpose === undefined) return undefined;
  return (
    purpose === 'ORGANIC_COMPOUND' ||
    purpose === 'COATING_FLAMMABLE_VAPOR' ||
    purpose === 'COMBUSTIBLE_DUST'
  );
}

// ---------------------------------------------------------------------------
// M4-주요구조부분변경 — 고시 제2조제1항제6호 가~마목 (증설·교체·개조에만 적용)
//
// 전제(도입부 "~설비 중"): 각 목 전부 "해당 설비가 이미 고시 제3조 기준을
// 충족하는 대상설비"라는 것을 전제한다 — existingTarget 입력으로 받는다.
// 이 값은 Engine이 다시 계산하는 게 아니라 호출자가 넘기는 입력 사실이다
// (검토자 지적: "기존 대상설비 여부"와 "현재 변경행위"를 한 Engine 안에서
// 순환적으로 섞지 않기 위함) — Snapshot에도 입력 그대로 기록된다.
// ---------------------------------------------------------------------------

function evaluateM4Modification(change, workType) {
  const applicability =
    workType === WORK_TYPE.MODIFICATION
      ? APPLICABILITY.APPLICABLE
      : APPLICABILITY.NOT_APPLICABLE_TO_WORK_TYPE;

  if (applicability !== APPLICABILITY.APPLICABLE) {
    return { ruleId: 'M4-CHANGE', status: STATUS.NOT_TARGET, applicability, equipmentResults: {} };
  }

  // 검토자 지적: 증설·교체·개조 작업인데 equipmentChange 자체가 없으면
  // "변경 대상이 없다"(false)가 아니라 "입력 자체가 없다"(UNKNOWN)다.
  if (change === undefined) {
    return {
      ruleId: 'M4-CHANGE',
      status: STATUS.UNKNOWN,
      applicability,
      equipmentResults: {},
      reason: '대상설비 변경사항 정보가 없어 판단할 수 없음',
    };
  }

  const equipmentResults = {
    meltingFurnace: evaluateMeltingFurnace_Change(change.meltingFurnace),
    chemicalEquipment: evaluateChemicalEquipment_Change(change.chemicalEquipment),
    dryingEquipment: evaluateDryingEquipment_Change(change.dryingEquipment),
    gasWeldingAssembly: evaluateGasWeldingAssembly_Change(change.gasWeldingAssembly),
    ventilation: evaluateVentilation_Change(change.ventilation),
  };

  const three = or3(
    equipmentResults.meltingFurnace.three,
    equipmentResults.chemicalEquipment.three,
    equipmentResults.dryingEquipment.three,
    equipmentResults.gasWeldingAssembly.three,
    equipmentResults.ventilation.three
  );

  return {
    ruleId: 'M4-CHANGE',
    status: toStatus(three),
    applicability,
    legalBasis: [LAW_BASIS.NOTICE_2_1_6.ruleId],
    equipmentResults,
  };
}

// eq가 아예 없으면(해당 설비에 대한 응답 자체가 없으면) 그 설비는 판정할
// 정보가 없다는 뜻 — false가 아니라 undefined(그 설비 자체는 or3 결합에서
// unknown으로 잡히되, existingTarget이 명시적으로 false면 and3가 그 즉시
// NOT_TARGET으로 확정한다).

function evaluateMeltingFurnace_Change(eq) {
  if (!eq) return { three: undefined, reason: '변경사항 정보 없음' };
  const three = and3(toThreeValued(eq.existingTarget), toThreeValued(eq.heatSourceTypeChanged));
  return { three, reason: describeChangeReason(three, '용해로 열원 종류 변경') };
}

function evaluateChemicalEquipment_Change(eq) {
  if (!eq) return { three: undefined, reason: '변경사항 정보 없음' };
  const trigger = or3(
    toThreeValued(eq.productionOrMaterialChangeReplacement),
    toThreeValued(eq.managedSubstanceEquipmentChangeCausingVelocityDecreaseOrAirflowIncrease)
  );
  const three = and3(toThreeValued(eq.existingTarget), trigger);
  return { three, reason: describeChangeReason(three, '화학설비 교체·변경·추가 또는 유해물질설비 변경') };
}

function evaluateDryingEquipment_Change(eq) {
  if (!eq) return { three: undefined, reason: '변경사항 정보 없음' };
  const existingTarget = toThreeValued(eq.existingTarget);

  // 경로A: 열원 종류 변경
  const pathA = and3(existingTarget, toThreeValued(eq.heatSourceTypeChanged));
  // 경로B: 건조대상물 변경 + 신규 목적이 제3조제3호 각목 재해당(크기기준 재적용 안 함)
  const pathB = and3(
    existingTarget,
    toThreeValued(eq.dryingTargetChanged),
    isValidDryingPurpose(eq.newPurpose)
  );

  const three = or3(pathA, pathB);
  return { three, reason: describeChangeReason(three, '건조설비 열원종류 변경 또는 건조대상물 변경') };
}

function evaluateGasWeldingAssembly_Change(eq) {
  if (!eq) return { three: undefined, reason: '변경사항 정보 없음' };
  const three = and3(toThreeValued(eq.existingTarget), toThreeValued(eq.mainPipeStructureChanged));
  return { three, reason: describeChangeReason(three, '가스집합용접장치 주관 구조 변경') };
}

function evaluateVentilation_Change(eq) {
  if (!eq) return { three: undefined, reason: '변경사항 정보 없음' };
  const three = and3(
    toThreeValued(eq.existingTarget),
    toThreeValued(eq.equipmentChangeCausingVelocityDecreaseOrAirflowIncrease)
  );
  return { three, reason: describeChangeReason(three, '유해물질/분진 설비 추가·변경으로 풍속감소·배풍량증가') };
}

function toThreeValued(value) {
  return value === undefined ? undefined : Boolean(value);
}

function describeChangeReason(three, label) {
  if (three === undefined) return `${label} — 기존 대상설비 여부 또는 변경사항 정보 없음`;
  return three ? `${label}: 조건 충족` : `${label}: 조건 불충족`;
}

// ---------------------------------------------------------------------------
// finalStatus / determinationCompleteness 집계
// (RULE-CONTRACT.md "결과 상태" 절 그대로 — Invariant 8, 9)
//
// 집계는 applicability===APPLICABLE인 모듈만 대상으로 한다.
// NOT_APPLICABLE_TO_WORK_TYPE 모듈은 NOT_TARGET으로 잘못 세지 않는다
// (STEP 5 지시 13번).
// ---------------------------------------------------------------------------

function aggregate(moduleResults) {
  const applicableResults = Object.values(moduleResults).filter(
    (m) => m.applicability === APPLICABILITY.APPLICABLE
  );

  const hasTarget = applicableResults.some((m) => m.status === STATUS.TARGET);
  const hasUnknown = applicableResults.some((m) => m.status === STATUS.UNKNOWN);

  let finalStatus;
  if (hasTarget) finalStatus = STATUS.TARGET;
  else if (hasUnknown) finalStatus = STATUS.UNKNOWN;
  else finalStatus = STATUS.NOT_TARGET;

  const determinationCompleteness = hasUnknown ? 'INCOMPLETE' : 'COMPLETE';

  const reasons = applicableResults.filter((m) => m.status === STATUS.TARGET).map((m) => m.ruleId);

  return { finalStatus, determinationCompleteness, reasons };
}

// ---------------------------------------------------------------------------
// evaluate() — 유일한 공개 진입점
// ---------------------------------------------------------------------------

/**
 * @param {object} input  Engine Input (아래 README-ENGINE.md 참고)
 * @param {object} [meta] { snapshotId, now } — Engine이 시간에 의존하지
 *   않기 위해 호출자가 명시적으로 넘긴다. 생략 가능(그러면 snapshot에
 *   해당 필드가 없다 — undefined를 스스로 생성하지 않는다).
 * @returns {object} Snapshot — 불변(Object.freeze)
 */
function evaluate(input, meta) {
  const module1 = evaluateModule1(input);
  const module2 = evaluateModule2(input, module1);
  const module3 = evaluateModule3(input, module1);
  const module4 = evaluateModule4(input);

  const moduleResults = Object.freeze({ module1, module2, module3, module4 });
  const { finalStatus, determinationCompleteness, reasons } = aggregate(moduleResults);

  const snapshot = {
    snapshotId: meta && meta.snapshotId,
    createdAt: meta && meta.now,
    engineVersion: ENGINE_VERSION,
    ruleVersion: RULE_VERSION,
    input: deepFreeze(clone(input)),
    moduleResults: deepFreeze(clone(moduleResults)),
    finalStatus,
    determinationCompleteness,
    reasons: Object.freeze(reasons),
  };

  return deepFreeze(snapshot);
}

function clone(value) {
  return value === undefined ? undefined : JSON.parse(JSON.stringify(value));
}

function deepFreeze(obj) {
  if (obj && typeof obj === 'object' && !Object.isFrozen(obj)) {
    Object.values(obj).forEach(deepFreeze);
    Object.freeze(obj);
  }
  return obj;
}

module.exports = {
  evaluate,
  STATUS,
  APPLICABILITY,
  ENGINE_VERSION,
  RULE_VERSION,
  INDUSTRY_LIST,
  // 아래는 테스트·회귀검증 전용 export (내부 모듈 단위 검증용)
  _internal: {
    and3,
    or3,
    evaluateModule1,
    evaluateModule2,
    evaluateModule3,
    evaluateModule4,
    aggregate,
  },
};

},
'./report.js': function (module, exports, require) {
/**
 * report.js — STEP 6-1 Report 계층 (REPORT-DESIGN.md 구현)
 *
 *   Snapshot ──▶ buildReportModel(snapshot, lawBasis, ctx) ──▶ ReportModel
 *                ReportModel ──▶ toUserView(model) ──▶ UserView (허용 목록만)
 *
 * 계약 (REPORT-DESIGN.md / UI-DESIGN.md):
 *  - Snapshot을 읽기만 한다(변경 금지). Engine을 호출하지 않는다.
 *  - engine.js / data.js를 import하지 않는다. LAW_BASIS와 현재 ruleVersion은 인자로 받는다.
 *  - 임계값 재계산, 법령 조건 재판정, `reason` 파싱을 하지 않는다.
 *  - three:true=조건 충족 / three:false=조건 미충족 / three 키 없음=확인 필요 — 그 이상 해석하지 않는다.
 *  - N/A 모듈·경로의 status는 결과로 표시하지 않는다(applicability 우선).
 *  - 제6조(제출면제), Pro/Free 분기는 존재하지 않는다.
 *  - 개발자용 provenance(note, openItems, ruleContractRef, ruleId, reason, ruleVersion 원문 등)는
 *    ReportModel에만 보존되고, toUserView의 허용 목록 밖이므로 사용자 화면으로 전달되지 않는다.
 *
 * 아래 상수 문자열(status/applicability/workType 값)은 Snapshot의 값 어휘를 그대로 적은 것이며,
 * 일치 여부는 tests-ui.js의 계약 테스트가 engine.js/data.js와 대조해 검증한다.
 */
'use strict';

// ---- Snapshot 값 어휘 (계약 테스트가 Engine과 대조) -----------------------------
const V = Object.freeze({
  TARGET: 'TARGET',
  NOT_TARGET: 'NOT_TARGET',
  UNKNOWN: 'UNKNOWN',
  APPLICABLE: 'APPLICABLE',
  COMPLETE: 'COMPLETE',
  INCOMPLETE: 'INCOMPLETE',
});

// ---- 사용자 문구 (UI-DESIGN.md §12-2, §12-5, §12-6) ---------------------------------
const COPY = Object.freeze({
  headline: Object.freeze({

    'TARGET|INCOMPLETE': {

      tone: 'target',
    },
    'UNKNOWN|INCOMPLETE': { text: '대상 여부 확인이 필요합니다.', subtitle: null, tone: 'unknown' },
    'NOT_TARGET|COMPLETE': {

    },
  }),
  // 승인 4종 밖의 조합 — 임의 문구를 만들지 않고 오류 상태로 표시한다.
  headlineError: '결과를 표시할 수 없습니다. 처음부터 다시 시도해 주세요.',
  workType: Object.freeze({
    NEW: '신설',
    FULL_RELOCATION: '전체 이전',
    PARTIAL_RELOCATION: '일부 설비 이전(이설)',
    MODIFICATION: '증설·교체·개조(주요 구조부분 변경)',
  }),
  notApplicable: '이번 작업 유형에는 적용되지 않음',
  inactivePath: '이번 작업 유형에는 적용되지 않는 경로',
  result: Object.freeze({ TARGET: '대상', NOT_TARGET: '대상 아님', UNKNOWN: '확인 필요' }),
  precondition: Object.freeze({ TARGET: '충족', NOT_TARGET: '미충족', UNKNOWN: '확인 필요' }),
  preconditionNote: '독립 제출 사유가 아니라 다른 항목의 전제조건입니다.',
  row: Object.freeze({ MET: '조건 충족', NOT_MET: '조건 미충족', UNKNOWN: '확인 필요' }),
  versionBanner: '이 결과는 현재와 다른 판정 기준으로 만들어졌습니다. 최신 기준으로 다시 확인해 주세요.',
  // 이설 M4 — 승인된 고정 문구(UI-DESIGN §12-5, 그대로)
  unresolved: Object.freeze([
    '일부 설비 이전(이설) 시 대상설비 5종의 적용 기준이 아직 확정되지 않았습니다.',
    "따라서 이 항목은 '대상 아님'으로 처리하지 않고 '확인 필요'로 남깁니다. 이 항목이 확인되지 않아 전체 판단이 완전하지 않습니다.",
    '이설에 해당하는 경우 관련 기준을 별도로 확인해 주세요.',
  ]),
  reliability: Object.freeze({ PRIMARY: '1차 자료 대조 확인' }),
  basisMissing: '근거 데이터 없음',
});

const MODULES = Object.freeze([
  { id: 'M1', key: 'module1', label: '사업장 기준 (업종·계약용량)', target: 'business', input: '사업장 기준(업종·계약용량) 정보가 부족합니다.' },
  { id: 'M2', key: 'module2', label: '증설·교체·개조 (정격용량)', target: 'increase', input: '증설·교체·개조 정격용량 정보가 부족합니다.' },
  { id: 'M3', key: 'module3', label: '일부 설비 이전·이설 (정격용량)', target: 'relocation', input: '이설 설비 정격용량 정보가 부족합니다.' },
]);
const M4_LABEL = '대상설비 5종';
const M4_TARGET = 'equipment';
const M4_PATH_UNKNOWN_TEXT = '대상설비 해당 여부 정보가 부족합니다.';

const EQUIPMENT = Object.freeze([
  { key: 'meltingFurnace', label: '용해로' },
  { key: 'chemicalEquipment', label: '화학설비' },
  { key: 'dryingEquipment', label: '건조설비' },
  { key: 'gasWeldingAssembly', label: '가스집합용접장치' },
  { key: 'ventilation', label: '유해물질 밀폐·환기·배기설비' },
]);
const PATHS = Object.freeze([
  { key: 'installation', label: '설치·전체 이전 기준' },
  { key: 'modification', label: '주요 구조부분 변경 기준' },
]);

// ---- 작은 헬퍼 (모두 Snapshot 읽기 전용) -------------------------------------------
function statusKey(s) {
  // 알 수 없는 값은 fail-closed로 '확인 필요'. NOT_TARGET으로 바꾸지 않는다.
  return s === V.TARGET || s === V.NOT_TARGET ? s : V.UNKNOWN;
}

function lookupBasis(ids, lawBasis) {
  const seen = new Set();
  const out = [];
  for (const id of ids || []) {
    if (seen.has(id)) continue;
    seen.add(id);
    const e = lawBasis && Object.prototype.hasOwnProperty.call(lawBasis, id) ? lawBasis[id] : undefined;
    out.push({
      ruleId: id, // provenance (사용자 화면 금지)
      found: !!e,
      statute: e ? e.statute : undefined,
      text: e ? e.text : undefined,
      effectiveDate: e ? e.effectiveDate : undefined,
      noticeNo: e ? e.noticeNo : undefined,
      reliability: e ? e.reliability : undefined,
      note: e ? e.note : undefined, // provenance
      openItems: e ? e.openItems : undefined, // provenance
      ruleContractRef: e ? e.ruleContractRef : undefined, // provenance
    });
  }
  return out;
}

function buildModuleModel(def, snap, lawBasis, anyDependentApplicable) {
  const r = snap.moduleResults && snap.moduleResults[def.key];
  const applicable = !!r && r.applicability === V.APPLICABLE;
  let display;
  if (applicable) display = 'APPLICABLE';
  else if (def.id === 'M1' && anyDependentApplicable) display = 'PRECONDITION'; // M2/M3가 전제조건으로 사용
  else display = 'NOT_APPLICABLE';
  return {
    id: def.id,
    label: def.label,
    target: def.target,
    display,
    resultKey: r ? statusKey(r.status) : V.UNKNOWN,
    basis: lookupBasis(r && r.legalBasis, lawBasis),
    reasonRaw: r ? r.reason : undefined, // provenance (사용자 화면 금지)
    inputsUsedRaw: r ? r.inputsUsed : undefined, // provenance
  };
}

function buildPathModel(def, p, lawBasis) {
  if (!p) return { kind: def.key, label: def.label, present: false, applicable: false, rows: [], basis: [] };
  const applicable = p.applicability === V.APPLICABLE;
  const results = p.equipmentResults || {};
  const hasAnyKey = Object.keys(results).length > 0;
  const pathStatus = statusKey(p.status);
  // 설비 행: 적용 경로이면서, (결과 키가 하나라도 있거나 경로가 확인 필요)일 때만. 키 없음 = 확인 필요(C1).
  // 경로가 '대상 아님'이고 결과 키가 없는 경우(해당 설비 없음 확정)에는 행 없이 경로 수준 결과만 표시한다.
  const showRows = applicable && (hasAnyKey || pathStatus === V.UNKNOWN);
  const rows = showRows
    ? EQUIPMENT.map((e) => {
        const has = Object.prototype.hasOwnProperty.call(results, e.key);
        const item = has ? results[e.key] : undefined;
        const three = item && Object.prototype.hasOwnProperty.call(item, 'three') ? item.three : undefined;
        const state = three === true ? 'MET' : three === false ? 'NOT_MET' : 'UNKNOWN';
        return { key: e.key, label: e.label, state, reasonRaw: item ? item.reason : undefined };
      })
    : [];
  return {
    kind: def.key,
    label: def.label,
    present: true,
    applicable,
    resultKey: pathStatus,
    rows,
    basis: lookupBasis(p.legalBasis, lawBasis),
    reasonRaw: p.reason, // provenance
  };
}

/**
 * Snapshot → ReportModel. Snapshot을 변경하지 않는다.
 * @param {object} snapshot  Engine이 만든 Snapshot
 * @param {object} lawBasis  LAW_BASIS (호출자가 전달)
 * @param {object} [ctx]     { currentRuleVersion } — ruleVersion 불일치 여부 비교용(원문은 모델에만 보존)
 */
function buildReportModel(snapshot, lawBasis, ctx) {
  const snap = snapshot || {};
  const mr = snap.moduleResults || {};
  const key = String(snap.finalStatus) + '|' + String(snap.determinationCompleteness);
  const headline = Object.prototype.hasOwnProperty.call(COPY.headline, key)
    ? { ok: true, key, ...COPY.headline[key] }
    : { ok: false, key, text: COPY.headlineError, subtitle: null, tone: 'error' };

  const dependentApplicable = ['module2', 'module3'].some((k) => mr[k] && mr[k].applicability === V.APPLICABLE);
  const modules = MODULES.map((d) => buildModuleModel(d, snap, lawBasis, dependentApplicable));

  // 모듈 4
  const m4r = mr.module4;
  const paths = PATHS.map((d) => buildPathModel(d, m4r && m4r.paths && m4r.paths[d.key], lawBasis));
  const m4Basis = lookupBasis(
    [].concat((m4r && m4r.legalBasis) || [], ...paths.filter((p) => p.applicable).map((p) => p.basis.map((b) => b.ruleId))),
    lawBasis
  );
  const m4 = {
    label: M4_LABEL,
    target: M4_TARGET,
    resultKey: m4r ? statusKey(m4r.status) : V.UNKNOWN,
    unresolved: !!(m4r && m4r.unresolvedLegalIssue),
    unresolvedRaw: m4r ? m4r.unresolvedLegalIssue : undefined, // provenance
    paths,
    basis: m4Basis,
    reasonRaw: m4r ? m4r.reason : undefined, // provenance
  };

  // 대상 판단 근거(B): reasons는 '대상 모듈' 식별에만 쓴다. M4의 대상 설비는 equipmentResults(three:true)에서만 도출한다.
  const reasonIds = Array.isArray(snap.reasons) ? snap.reasons : [];
  const targetModules = [];
  for (const m of modules) {
    if (reasonIds.includes(m.id)) targetModules.push({ label: m.label, equipment: [] });
  }
  if (reasonIds.includes('M4')) {
    const equipment = [];
    for (const p of paths) {
      if (!p.applicable) continue;
      for (const r of p.rows) if (r.state === 'MET') equipment.push(r.label);
    }
    targetModules.push({ label: M4_LABEL, equipment });
  }

  // 확인 필요(E) — 문구 출처: 구조 필드 기반 고정 문구 / 이설 고정 문구 / 입력 보완 안내(구조에서 직접 확인되는 범위)
  const confirmItems = [];
  const addItem = (kind, target, text) => {
    if (!confirmItems.some((i) => i.text === text)) confirmItems.push({ kind, target, text });
  };
  const m1 = modules[0];
  if (m1.display === 'PRECONDITION' && m1.resultKey === V.UNKNOWN) addItem('INPUT', m1.target, MODULES[0].input);
  modules.forEach((m, i) => {
    if (m.display === 'APPLICABLE' && m.resultKey === V.UNKNOWN) addItem('INPUT', m.target, MODULES[i].input);
  });
  if (m4.unresolved) {
    addItem('UNRESOLVED', M4_TARGET, COPY.unresolved.join(' '));
  } else if (m4.resultKey === V.UNKNOWN) {
    let added = false;
    for (const p of paths) {
      if (!p.applicable) continue;
      for (const r of p.rows) {
        if (r.state === 'UNKNOWN') {
          addItem('INPUT', M4_TARGET, r.label + ': 세부 조건 입력이 필요합니다.');
          added = true;
        }
      }
    }
    if (!added) addItem('INPUT', M4_TARGET, M4_PATH_UNKNOWN_TEXT);
  }

  const cur = ctx && ctx.currentRuleVersion;
  const meta = {
    createdAt: typeof snap.createdAt === 'string' ? snap.createdAt : undefined,
    snapshotId: snap.snapshotId, // provenance
    engineVersion: snap.engineVersion, // provenance
    ruleVersion: snap.ruleVersion, // provenance (원문은 사용자 화면 금지)
    ruleVersionMismatch: cur !== undefined && snap.ruleVersion !== cur,
  };

  return {
    headline,
    finalStatus: snap.finalStatus, // provenance
    determinationCompleteness: snap.determinationCompleteness, // provenance
    workType: snap.input ? snap.input.workType : undefined,
    targetModules,
    modules,
    m4,
    confirmItems,
    meta,
  };
}

// ---- ReportModel → UserView (허용 목록 투영) -----------------------------------------
function userBasis(list) {
  return (list || []).map((b) =>
    b.found
      ? {
          missing: false,
          statute: b.statute,
          text: b.text,
          effectiveDate: b.effectiveDate,
          noticeNo: b.noticeNo,
          reliabilityLabel: Object.prototype.hasOwnProperty.call(COPY.reliability, b.reliability)
            ? COPY.reliability[b.reliability]
            : null,
        }
      : { missing: true, message: COPY.basisMissing } // 내부 ID는 노출하지 않는다
  );
}

function toneOf(k) {
  return k === V.TARGET ? 'target' : k === V.UNKNOWN ? 'unknown' : 'neutral';
}

/**
 * ReportModel → UserView. **허용 목록**: 여기서 명시적으로 만든 필드만 존재한다.
 * note / openItems / ruleContractRef / ruleId / reason / ruleVersion·engineVersion·snapshotId 원문은 포함되지 않는다.
 */
function toUserView(model) {
  const m = model;
  const modules = m.modules.map((x) => {
    if (x.display === 'APPLICABLE') {
      return {
        label: x.label,
        target: x.target,
        display: 'APPLICABLE',
        resultLabel: COPY.result[x.resultKey],
        tone: toneOf(x.resultKey),
        basis: userBasis(x.basis),
      };
    }
    if (x.display === 'PRECONDITION') {
      return {
        label: x.label,
        target: x.target,
        display: 'PRECONDITION',
        resultLabel: COPY.precondition[x.resultKey],
        tone: toneOf(x.resultKey),
        message: COPY.preconditionNote,
        basis: userBasis(x.basis),
      };
    }
    // N/A — status는 전달하지 않는다
    return { label: x.label, target: x.target, display: 'NOT_APPLICABLE', message: COPY.notApplicable, basis: [] };
  });

  const m4 = {
    label: m.m4.label,
    target: m.m4.target,
    resultLabel: COPY.result[m.m4.resultKey],
    tone: toneOf(m.m4.resultKey),
    unresolvedLines: m.m4.unresolved ? COPY.unresolved.slice() : null,
    paths: m.m4.paths
      .filter((p) => p.applicable && !m.m4.unresolved)
      .map((p) => ({
        label: p.label,
        resultLabel: COPY.result[p.resultKey],
        tone: toneOf(p.resultKey),
        rows: p.rows.map((r) => ({
          label: r.label,
          stateLabel: COPY.row[r.state],
          tone: r.state === 'MET' ? 'target' : r.state === 'UNKNOWN' ? 'unknown' : 'neutral',
        })),
      })),
    inactivePaths: m.m4.paths.filter((p) => p.present && !p.applicable).map((p) => p.label),
    inactiveMessage: COPY.inactivePath,
    basis: userBasis(m.m4.basis),
  };

  return {
    headline: { text: m.headline.text, subtitle: m.headline.subtitle, tone: m.headline.tone, ok: m.headline.ok },
    workTypeLabel: Object.prototype.hasOwnProperty.call(COPY.workType, m.workType) ? COPY.workType[m.workType] : null,
    targetModules: m.targetModules.map((t) => ({ label: t.label, equipment: t.equipment.slice() })),
    confirmItems: m.confirmItems.map((i) => ({ kind: i.kind, target: i.target, text: i.text })),
    modules,
    m4,
    footer: {
      createdAt: m.meta.createdAt || null,
      versionMismatch: !!m.meta.ruleVersionMismatch,
      versionBanner: m.meta.ruleVersionMismatch ? COPY.versionBanner : null,
    },
  };
}

module.exports = { buildReportModel, toUserView, REPORT_COPY: COPY, REPORT_VOCAB: V, REPORT_EQUIPMENT: EQUIPMENT };

    workType: undefined,
    industry: { choice: undefined, name: '' }, // choice: listed | not_listed | unknown
    contract: newNum(),
    equip: {
      selected: { melt: false, chem: false, dry: false, gas: false, vent: false },
      none: false,
      unknown: false,
      details: {
        melt: { capacity: newNum() },
        chem: { meets: undefined, excluded: undefined },
        dry: { fuel: newNum(), power: newNum(), purpose: undefined },
        gas: { quantity: newNum(), fixed: undefined },
        vent: { category: undefined, airVolume: newNum() },
      },
    },
    m2: { gross: newNum(), excluded: newNum() },
    m3: { relocated: newNum() },
    chg: {
      include: { melt: undefined, chem: undefined, dry: undefined, gas: undefined, vent: undefined },
      details: {
        melt: { existing: undefined, heat: undefined },
        chem: { existing: undefined, production: undefined, managed: undefined },
        dry: { existing: undefined, heat: undefined, target: undefined, newPurpose: undefined },
        gas: { existing: undefined, pipe: undefined },
        vent: { existing: undefined, change: undefined },
      },
    },
  };
}

function equipMode(state) {
  const e = state.equip;
  if (e.none) return 'NONE';
  if (e.unknown) return 'UNKNOWN';
  if (EQUIP_IDS.some((id) => e.selected[id])) return 'SELECT';
  return undefined;
}

/** 작업 형태별 단계 목록(선언형 조회). 법적 조건식 없음. */
function stepsFor(state) {
  const w = UI_WORK[state.workType];
  if (w === WORK.NEW || w === WORK.FULL_RELOCATION) {
    const s = ['workType', 'industry', 'contract', 'equip'];
    if (equipMode(state) === 'SELECT') s.push('equipDetail');
    s.push('result');
    return s;
  }
  if (w === WORK.MODIFICATION) return ['workType', 'industry', 'contract', 'equip', 'changeDetail', 'result'];
  if (w === WORK.PARTIAL_RELOCATION) return ['workType', 'industry', 'contract', 'relocationDetail', 'm4Notice', 'result'];
  return ['workType'];
}

// ---- 값 파싱: 형식 검증만(숫자/유한/음수 아님). 법적 임계값 비교 없음 -----------------
/** @returns {{kind:'omitted'|'unanswered'|'ok'|'negative'|'invalid', value?:number}} */
function parseNum(f) {
  if (f.unknown) return { kind: 'omitted' };
  const raw = String(f.value == null ? '' : f.value).replace(/,/g, '').trim();
  if (raw === '') return { kind: 'unanswered' };
  if (/^\d+(\.\d+)?$/.test(raw)) return { kind: 'ok', value: Number(raw) };
  if (/^-\s*\d/.test(raw)) return { kind: 'negative' };
  return { kind: 'invalid' };
}

const triToBool = (t) => (t === 'yes' ? true : t === 'no' ? false : undefined); // unknown/미응답 → 키 생략

function numOrUndef(f) {
  const p = parseNum(f);
  return p.kind === 'ok' ? p.value : undefined; // 빈 값/모름 → 키 생략, 사용자가 입력한 0은 0 보존
}

/** undefined 값과 빈 객체를 재귀적으로 제거. 빈 객체를 엔진에 보내지 않는다(equipment:{} 함정 방지). */
function prune(o) {
  if (Array.isArray(o) || o === null || typeof o !== 'object') return o;
  const out = {};
  for (const k of Object.keys(o)) {
    const v = prune(o[k]);
    if (v === undefined) continue;
    if (v !== null && typeof v === 'object' && !Array.isArray(v) && Object.keys(v).length === 0) continue;
    out[k] = v;
  }
  return out;
}

function dryVal(v) {
  // UI 토큰 → Engine 값. 모름/미응답은 undefined(키 생략). 'other'는 D-B에 따라 OTHER_NOT_IN_ARTICLE3.
  return Object.prototype.hasOwnProperty.call(UI_DRY, v) ? UI_DRY[v] : undefined;
}
function ventVal(v) {
  return Object.prototype.hasOwnProperty.call(UI_VENT, v) ? UI_VENT[v] : undefined;
}

function installationEquipment(state) {
  const mode = equipMode(state);
  if (mode === 'NONE') return { none: true }; // 명시적으로 "해당 설비 없음"을 고른 경우에만
  if (mode !== 'SELECT') return undefined; // 미응답/모름 → equipment 키 생략(→ UNKNOWN)
  const d = state.equip.details;
  const out = {};
  if (state.equip.selected.melt) out.meltingFurnace = { present: true, capacityTon: numOrUndef(d.melt.capacity) };
  if (state.equip.selected.chem) {
    out.chemicalEquipment = {
      present: true,
      meetsHazardousSubstanceThreshold: triToBool(d.chem.meets),
      excludedByDecree43_2: triToBool(d.chem.excluded),
    };
  }
  if (state.equip.selected.dry) {
    out.dryingEquipment = {
      present: true,
      fuelConsumptionKgPerHour: numOrUndef(d.dry.fuel),
      ratedPowerKw: numOrUndef(d.dry.power),
      purpose: dryVal(d.dry.purpose),
    };
  }
  if (state.equip.selected.gas) {
    out.gasWeldingAssembly = { present: true, flammableGasQuantityKg: numOrUndef(d.gas.quantity), isFixed: triToBool(d.gas.fixed) };
  }
  if (state.equip.selected.vent) {
    out.ventilation = { present: true, substanceCategory: ventVal(d.vent.category), exhaustAirVolumeM3PerMin: numOrUndef(d.vent.airVolume) };
  }
  return out;
}

/** D-A: 증설 STEP 4 — "포함 안 됨"은 변경 조건 false, "모름"은 키 생략, "포함됨"은 세부 질문 답. */
function changeEquipment(state) {
  const inc = state.chg.include;
  const d = state.chg.details;
  const out = {};
  const NO = false;
  if (inc.melt === 'no') out.meltingFurnace = { heatSourceTypeChanged: NO };
  else if (inc.melt === 'yes') out.meltingFurnace = { existingTarget: triToBool(d.melt.existing), heatSourceTypeChanged: triToBool(d.melt.heat) };

  if (inc.chem === 'no') {
    out.chemicalEquipment = { productionOrMaterialChangeReplacement: NO, managedSubstanceEquipmentChangeCausingVelocityDecreaseOrAirflowIncrease: NO };
  } else if (inc.chem === 'yes') {
    out.chemicalEquipment = {
      existingTarget: triToBool(d.chem.existing),
      productionOrMaterialChangeReplacement: triToBool(d.chem.production),
      managedSubstanceEquipmentChangeCausingVelocityDecreaseOrAirflowIncrease: triToBool(d.chem.managed),
    };
  }

  if (inc.dry === 'no') out.dryingEquipment = { heatSourceTypeChanged: NO, dryingTargetChanged: NO };
  else if (inc.dry === 'yes') {
    out.dryingEquipment = {
      existingTarget: triToBool(d.dry.existing),
      heatSourceTypeChanged: triToBool(d.dry.heat),
      dryingTargetChanged: triToBool(d.dry.target),
      newPurpose: d.dry.target === 'yes' ? dryVal(d.dry.newPurpose) : undefined,
    };
  }

  if (inc.gas === 'no') out.gasWeldingAssembly = { mainPipeStructureChanged: NO };
  else if (inc.gas === 'yes') out.gasWeldingAssembly = { existingTarget: triToBool(d.gas.existing), mainPipeStructureChanged: triToBool(d.gas.pipe) };

  if (inc.vent === 'no') out.ventilation = { equipmentChangeCausingVelocityDecreaseOrAirflowIncrease: NO };
  else if (inc.vent === 'yes') {
    out.ventilation = { existingTarget: triToBool(d.vent.existing), equipmentChangeCausingVelocityDecreaseOrAirflowIncrease: triToBool(d.vent.change) };
  }
  return out;
}

/**
 * 순수 매핑: UI 상태 → Engine 입력. 판정·검증 없음.
 * - 모름/미응답/빈 값 → 키 생략. 명시적 0은 0. 빈 객체 금지(prune).
 * - 현재 작업 형태에서 쓰이지 않는 입력(이설의 설비 입력 등)은 상태에 남아 있어도 보내지 않는다.
 */
function buildEngineInput(state) {
  const w = UI_WORK[state.workType];
  const input = { workType: w };
  const ind = state.industry;
  input.businessType = { withinListedIndustries: ind.choice === 'listed' ? true : ind.choice === 'not_listed' ? false : undefined };
  input.contractCapacityKw = numOrUndef(state.contract);
  if (w === WORK.NEW || w === WORK.FULL_RELOCATION) {
    input.equipment = installationEquipment(state);
  } else if (w === WORK.MODIFICATION) {
    input.module2 = {
      grossRatedCapacityIncreaseKw: numOrUndef(state.m2.gross),
      sameManufacturerSameModelExcludedKw: numOrUndef(state.m2.excluded),
    };
    input.equipmentChange = changeEquipment(state);
  } else if (w === WORK.PARTIAL_RELOCATION) {
    input.module3 = { relocatedRatedCapacityKw: numOrUndef(state.m3.relocated) };
  }
  return prune(input);
}

// ---- 필수 질문 검증(D-F): 선택 없이 "다음" 불가, 숫자는 형식·음수만 차단 ---------------
const MSG = Object.freeze({
  select: '선택해 주세요.',
  number: '숫자로 입력해 주세요.',
  negative: '음수는 입력할 수 없습니다. 0 이상의 숫자로 입력해 주세요.',
  numberOrUnknown: '숫자를 입력하거나 "아직 확인 못 함"을 선택해 주세요.',
});

function checkNum(errs, id, f) {
  const p = parseNum(f);
  if (p.kind === 'unanswered') errs.push({ id, message: MSG.numberOrUnknown });
  else if (p.kind === 'invalid') errs.push({ id, message: MSG.number });
  else if (p.kind === 'negative') errs.push({ id, message: MSG.negative });
}
function checkTri(errs, id, v) {
  if (v === undefined) errs.push({ id, message: MSG.select });
}

/** @returns {{id:string,message:string}[]} 비어 있으면 진행 가능. 법적 임계값 비교 없음. */
function validateStep(state, step) {
  const errs = [];
  if (step === 'workType') {
    if (!state.workType) errs.push({ id: 'g-workType', message: MSG.select });
  } else if (step === 'industry') {
    const i = state.industry;
    if (!i.choice) errs.push({ id: 'g-industry', message: MSG.select });
    else if (i.choice === 'listed' && !i.name) errs.push({ id: 'f-industry-name', message: MSG.select });
  } else if (step === 'contract') {
    checkNum(errs, 'f-contract', state.contract);
  } else if (step === 'equip') {
    if (state.workType === 'modify') {
      for (const id of EQUIP_IDS) checkTri(errs, 'g-include-' + id, state.chg.include[id]);
    } else if (!equipMode(state)) {
      errs.push({ id: 'g-equip', message: MSG.select });
    }
  } else if (step === 'equipDetail') {
    const s = state.equip.selected;
    const d = state.equip.details;
    if (s.melt) checkNum(errs, 'f-melt-capacity', d.melt.capacity);
    if (s.chem) {
      checkTri(errs, 'g-chem-meets', d.chem.meets);
      checkTri(errs, 'g-chem-excluded', d.chem.excluded);
    }
    if (s.dry) {
      checkNum(errs, 'f-dry-fuel', d.dry.fuel);
      checkNum(errs, 'f-dry-power', d.dry.power);
      checkTri(errs, 'g-dry-purpose', d.dry.purpose);
    }
    if (s.gas) {
      checkNum(errs, 'f-gas-quantity', d.gas.quantity);
      checkTri(errs, 'g-gas-fixed', d.gas.fixed);
    }
    if (s.vent) {
      checkTri(errs, 'g-vent-category', d.vent.category);
      checkNum(errs, 'f-vent-airVolume', d.vent.airVolume);
    }
  } else if (step === 'changeDetail') {
    checkNum(errs, 'f-m2-gross', state.m2.gross);
    checkNum(errs, 'f-m2-excluded', state.m2.excluded);
    const inc = state.chg.include;
    const d = state.chg.details;
    if (inc.melt === 'yes') {
      checkTri(errs, 'g-melt-existing', d.melt.existing);
      checkTri(errs, 'g-melt-heat', d.melt.heat);
    }
    if (inc.chem === 'yes') {
      checkTri(errs, 'g-chem-existing', d.chem.existing);
      checkTri(errs, 'g-chem-production', d.chem.production);
      checkTri(errs, 'g-chem-managed', d.chem.managed);
    }
    if (inc.dry === 'yes') {
      checkTri(errs, 'g-dry-existing', d.dry.existing);
      checkTri(errs, 'g-dry-heat', d.dry.heat);
      checkTri(errs, 'g-dry-target', d.dry.target);
      if (d.dry.target === 'yes') checkTri(errs, 'g-dry-newPurpose', d.dry.newPurpose);
    }
    if (inc.gas === 'yes') {
      checkTri(errs, 'g-gas-existing', d.gas.existing);
      checkTri(errs, 'g-gas-pipe', d.gas.pipe);
    }
    if (inc.vent === 'yes') {
      checkTri(errs, 'g-vent-existing', d.vent.existing);
      checkTri(errs, 'g-vent-change', d.vent.change);
    }
  } else if (step === 'relocationDetail') {
    checkNum(errs, 'f-m3-relocated', state.m3.relocated);
  }
  return errs;
}

/** 확인 필요 항목의 "입력 수정" 이동 대상 단계 — 정적 매핑(판정 아님). */
function stepForTarget(state, target) {
  const steps = stepsFor(state);
  const pick = (...c) => c.find((s) => steps.includes(s));
  if (target === 'business') return 'industry';
  if (target === 'increase') return pick('changeDetail');
  if (target === 'relocation') return pick('relocationDetail');
  if (target === 'equipment') return pick('equipDetail', 'equip');
  return steps[0];
}

module.exports = {
  WORK,
  DRYING,
  VENT,
  UI_WORK,
  UI_DRY,
  UI_VENT,
  EQUIP_IDS,
  ENGINE_KEY,
  STEP_NUMBER,
  MSG,
  initialState,
  equipMode,
  stepsFor,
  parseNum,
  prune,
  buildEngineInput,
  validateStep,
  stepForTarget,
};

},

'./ui-render.js': function (module, exports, require) {
/**
 * ui-render.js — 화면 렌더러 (순수 함수: 상태/UserView → HTML 문자열)
 *
 *  - 결과 화면은 UserView(허용 목록 투영)만 받는다. ReportModel/Snapshot에는 접근하지 않는다.
 *  - 법적 판정·임계값 비교 없음. engine.js / data.js를 import하지 않는다.
 *  - DOM(속성 포함)에 Engine 열거값·내부 필드명·내부 ID·개발 문서명이 들어가지 않는다.
 *  - 모든 동적 문자열은 esc()로 이스케이프한다.
 */
'use strict';

const { COPY } = require('./ui-copy.js');
const { EQUIP_IDS, STEP_NUMBER, stepsFor } = require('./ui-model.js');

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function errMsg(errors, id) {
  const e = (errors || []).find((x) => x.id === id);
  return e ? e.message : null;
}

function getPath(obj, path) {
  return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
}

// ---- 입력 컨트롤 ----------------------------------------------------------------------
function radioGroup(state, errors, { id, path, legend, options }) {
  const cur = getPath(state, path);
  const m = errMsg(errors, id);
  const items = options
    .map((o, i) => {
      const iid = id + '-' + i;
      return (
        '<label class="opt" for="' + iid + '"><input type="radio" id="' + iid + '" name="' + esc(id) + '" data-path="' + esc(path) +
        '" value="' + esc(o.value) + '"' + (cur === o.value ? ' checked' : '') + '><span>' + esc(o.label) + '</span></label>'
      );
    })
    .join('');
  return (
    '<fieldset class="group' + (m ? ' has-error' : '') + '" id="' + esc(id) + '"' + (m ? ' aria-describedby="err-' + esc(id) + '"' : '') +
    '><legend>' + esc(legend) + '</legend>' + items +
    (m ? '<p class="err" id="err-' + esc(id) + '">' + esc(m) + '</p>' : '') + '</fieldset>'
  );
}

function numField(state, errors, { id, path, label, unit }) {
  const f = getPath(state, path);
  const m = errMsg(errors, id);
  return (
    '<div class="field' + (m ? ' has-error' : '') + '" id="' + esc(id) + '">' +
    '<label class="q" for="' + esc(id) + '-input">' + esc(label) + '</label>' +
    '<div class="row"><input id="' + esc(id) + '-input" type="text" inputmode="decimal" autocomplete="off" data-path="' + esc(path) +
    '.value" value="' + esc(f.value) + '"' + (f.unknown ? ' disabled' : '') + (m ? ' aria-invalid="true" aria-describedby="err-' + esc(id) + '"' : '') +
    '><span class="unit">' + esc(unit) + '</span></div>' +
    '<label class="opt" for="' + esc(id) + '-unknown"><input type="checkbox" id="' + esc(id) + '-unknown" data-path="' + esc(path) +
    '.unknown"' + (f.unknown ? ' checked' : '') + '><span>' + esc(COPY.unknown) + '</span></label>' +
    (m ? '<p class="err" id="err-' + esc(id) + '">' + esc(m) + '</p>' : '') + '</div>'
  );
}

// ---- 단계별 본문 -----------------------------------------------------------------------
function bodyWorkType(state, errors) {
  return radioGroup(state, errors, { id: 'g-workType', path: 'workType', legend: COPY.workTypeQ, options: COPY.workTypeOptions });
}

function bodyIndustry(state, errors, ctx) {
  const m = errMsg(errors, 'g-industry');
  const mName = errMsg(errors, 'f-industry-name');
  const ch = state.industry.choice;
  const opts = (ctx.industryList || [])
    .map((n) => '<option value="' + esc(n) + '"' + (state.industry.name === n ? ' selected' : '') + '>' + esc(n) + '</option>')
    .join('');
  const radio = (i, value, label) =>
    '<label class="opt" for="g-industry-' + i + '"><input type="radio" id="g-industry-' + i + '" name="g-industry" data-path="industry.choice" value="' +
    value + '"' + (ch === value ? ' checked' : '') + '><span>' + esc(label) + '</span></label>';
  return (
    '<fieldset class="group' + (m ? ' has-error' : '') + '" id="g-industry"><legend>' + esc(COPY.industryQ) + '</legend>' +
    radio(0, 'listed', COPY.industryListed) +
    '<div class="sub' + (mName ? ' has-error' : '') + '" id="f-industry-name"><label class="vh" for="f-industry-name-input">' + esc(COPY.industryPlaceholder) + '</label>' +
    '<select id="f-industry-name-input" data-path="industry.name"' + (ch === 'listed' ? '' : ' disabled') + (mName ? ' aria-invalid="true"' : '') + '>' +
    '<option value="">' + esc(COPY.industryPlaceholder) + '</option>' + opts + '</select>' +
    (mName ? '<p class="err" id="err-f-industry-name">' + esc(mName) + '</p>' : '') + '</div>' +
    radio(1, 'not_listed', COPY.industryNotListed) +
    radio(2, 'unknown', COPY.unknown) +
    (m ? '<p class="err" id="err-g-industry">' + esc(m) + '</p>' : '') + '</fieldset>'
  );
}

function bodyContract(state, errors) {
  return numField(state, errors, { id: 'f-contract', path: 'contract', label: COPY.contractQ, unit: COPY.unitKw });
}

function bodyEquip(state, errors) {
  if (state.workType === 'modify') {
    return (
      '<p class="lead">' + esc(COPY.equipChangeQ) + '</p>' +
      EQUIP_IDS.map((id) =>
        radioGroup(state, errors, { id: 'g-include-' + id, path: 'chg.include.' + id, legend: COPY.equipNames[id], options: COPY.includeOptions })
      ).join('')
    );
  }
  const m = errMsg(errors, 'g-equip');
  const e = state.equip;
  const cb = (key, label, checked) =>
    '<label class="opt" for="eq-' + key + '"><input type="checkbox" id="eq-' + key + '" data-action="equip-toggle" data-key="' + key + '"' +
    (checked ? ' checked' : '') + '><span>' + esc(label) + '</span></label>';
  return (
    '<fieldset class="group' + (m ? ' has-error' : '') + '" id="g-equip"><legend>' + esc(COPY.equipInstallQ) + '</legend>' +
    EQUIP_IDS.map((id) => cb(id, COPY.equipNames[id], e.selected[id])).join('') +
    '<hr class="sep">' + cb('none', COPY.equipNone, e.none) + cb('unknown', COPY.unknown, e.unknown) +
    (m ? '<p class="err" id="err-g-equip">' + esc(m) + '</p>' : '') + '</fieldset>'
  );
}

function section(title, inner) {
  return '<section class="subsec"><h3>' + esc(title) + '</h3>' + inner + '</section>';
}

function bodyEquipDetail(state, errors) {
  const s = state.equip.selected;
  const rg = (id, path, legend, options) => radioGroup(state, errors, { id, path, legend, options });
  const nf = (id, path, label, unit) => numField(state, errors, { id, path, label, unit });
  let out = '';
  if (s.melt) out += section(COPY.equipNames.melt, nf('f-melt-capacity', 'equip.details.melt.capacity', COPY.meltCapacityQ, COPY.unitTon));
  if (s.chem) {
    out += section(
      COPY.equipNames.chem,
      rg('g-chem-meets', 'equip.details.chem.meets', COPY.chemMeetsQ, COPY.yesNo) +
        rg('g-chem-excluded', 'equip.details.chem.excluded', COPY.chemExcludedQ, COPY.yesNo)
    );
  }
  if (s.dry) {
    out += section(
      COPY.equipNames.dry,
      nf('f-dry-fuel', 'equip.details.dry.fuel', COPY.dryFuelQ, COPY.unitKgH) +
        nf('f-dry-power', 'equip.details.dry.power', COPY.dryPowerQ, COPY.unitKw) +
        rg('g-dry-purpose', 'equip.details.dry.purpose', COPY.dryPurposeQ, COPY.dryPurposeOptions)
    );
  }
  if (s.gas) {
    out += section(
      COPY.equipNames.gas,
      nf('f-gas-quantity', 'equip.details.gas.quantity', COPY.gasQuantityQ, COPY.unitKg) +
        rg('g-gas-fixed', 'equip.details.gas.fixed', COPY.gasFixedQ, COPY.yesNo)
    );
  }
  if (s.vent) {
    out += section(
      COPY.equipNames.vent,
      rg('g-vent-category', 'equip.details.vent.category', COPY.ventCategoryQ, COPY.ventCategoryOptions) +
        nf('f-vent-airVolume', 'equip.details.vent.airVolume', COPY.ventAirVolumeQ, COPY.unitM3)
    );
  }
  return out;
}

function bodyChangeDetail(state, errors) {
  const inc = state.chg.include;
  const rg = (id, path, legend, options) => radioGroup(state, errors, { id, path, legend, options });
  const nf = (id, path, label, unit) => numField(state, errors, { id, path, label, unit });
  const yn = COPY.yesNo;
  let out = section(
    COPY.changeDetailTitle,
    nf('f-m2-gross', 'm2.gross', COPY.m2GrossQ, COPY.unitKw) + nf('f-m2-excluded', 'm2.excluded', COPY.m2ExcludedQ, COPY.unitKw)
  );
  const ex = (id) => rg('g-' + id + '-existing', 'chg.details.' + id + '.existing', COPY.existingQ(COPY.equipNames[id]), yn);
  if (inc.melt === 'yes') out += section(COPY.equipNames.melt, ex('melt') + rg('g-melt-heat', 'chg.details.melt.heat', COPY.heatQ, yn));
  if (inc.chem === 'yes') {
    out += section(
      COPY.equipNames.chem,
      ex('chem') + rg('g-chem-production', 'chg.details.chem.production', COPY.chemProductionQ, yn) + rg('g-chem-managed', 'chg.details.chem.managed', COPY.chemManagedQ, yn)
    );
  }
  if (inc.dry === 'yes') {
    out += section(
      COPY.equipNames.dry,
      ex('dry') +
        rg('g-dry-heat', 'chg.details.dry.heat', COPY.dryHeatQ, yn) +
        rg('g-dry-target', 'chg.details.dry.target', COPY.dryTargetQ, yn) +
        (state.chg.details.dry.target === 'yes' ? rg('g-dry-newPurpose', 'chg.details.dry.newPurpose', COPY.dryNewPurposeQ, COPY.dryPurposeOptions) : '')
    );
  }
  if (inc.gas === 'yes') out += section(COPY.equipNames.gas, ex('gas') + rg('g-gas-pipe', 'chg.details.gas.pipe', COPY.gasPipeQ, yn));
  if (inc.vent === 'yes') out += section(COPY.equipNames.vent, ex('vent') + rg('g-vent-change', 'chg.details.vent.change', COPY.ventChangeQ, yn));
  return out;
}

function bodyRelocationDetail(state, errors) {
  return numField(state, errors, { id: 'f-m3-relocated', path: 'm3.relocated', label: COPY.m3Q, unit: COPY.unitKw });
}

function bodyM4Notice() {
  return '<div class="callout tone-unknown">' + COPY.m4NoticeLines.map((l) => '<p>' + esc(l) + '</p>').join('') + '</div>';
}

const TITLES = {
  workType: () => COPY.workTypeQ,
  industry: () => COPY.industryQ,
  contract: () => COPY.contractQ,
  equip: (s) => (s.workType === 'modify' ? COPY.equipChangeQ : COPY.equipInstallQ),
  equipDetail: () => COPY.equipDetailTitle,
  changeDetail: () => COPY.changeDetailTitle,
  relocationDetail: () => COPY.relocationDetailTitle,
  m4Notice: () => COPY.m4NoticeTitle,
};

// 질문 문구는 fieldset의 legend에 이미 있으므로, 제목은 화면 이름 역할만 한다.
function stepHeading(state, step) {
  if (step === 'workType' || step === 'industry' || step === 'contract' || step === 'equip') {
    return { visible: false, text: TITLES[step](state) };
  }
  return { visible: true, text: TITLES[step](state) };
}

function renderErrorSummary(errors) {
  if (!errors || !errors.length) return '';
  return (
    '<div class="errsum" id="errsum" role="alert" tabindex="-1"><p><strong>' + esc(COPY.errorSummary) + '</strong></p><ul>' +
    errors.map((e) => '<li><a href="#' + esc(e.id) + '" data-action="focus-field" data-id="' + esc(e.id) + '">' + esc(e.message) + '</a></li>').join('') +
    '</ul></div>'
  );
}

/** 입력 단계 렌더링(시작 화면 포함). 결과 화면은 renderResult를 쓴다. */
function renderWizard(state, ctx) {
  const step = state.step;
  if (step === 'start') {
    return (
      '<section class="screen"><h1 id="step-title" tabindex="-1">' + esc(COPY.appTitle) + '</h1><p class="lead">' + esc(COPY.intro) + '</p>' +
      '<p class="scope">' + esc(COPY.scope) + '</p>' +
      '<div class="nav"><button type="button" class="btn primary" data-action="start">' + esc(COPY.start) + '</button></div></section>'
    );
  }
  const steps = stepsFor(state);
  const idx = steps.indexOf(step);
  const prevStep = idx > 0 ? steps[idx - 1] : null;
  const nextStep = idx >= 0 ? steps[idx + 1] : null;
  const errors = state.errors || [];
  const bodies = {
    workType: bodyWorkType,
    industry: (s, e) => bodyIndustry(s, e, ctx),
    contract: bodyContract,
    equip: bodyEquip,
    equipDetail: bodyEquipDetail,
    changeDetail: bodyChangeDetail,
    relocationDetail: bodyRelocationDetail,
    m4Notice: bodyM4Notice,
  };
  const h = stepHeading(state, step);
  const num = STEP_NUMBER[step];
  return (
    '<section class="screen" aria-labelledby="step-title">' +
    (num ? '<p class="stepno">' + esc(COPY.stepLabel(num)) + '</p>' : '') +
    '<h2 id="step-title" tabindex="-1"' + (h.visible ? '' : ' class="vh"') + '>' + esc(h.text) + '</h2>' +
    renderErrorSummary(errors) +
    bodies[step](state, errors) +
    '<p class="scope">' + esc(COPY.scope) + '</p>' +
    '<div class="nav">' +
    (prevStep ? '<button type="button" class="btn" data-action="prev">' + esc(COPY.prev) + '</button>' : '<span></span>') +
    '<button type="button" class="btn primary" data-action="next">' + esc(nextStep === 'result' ? COPY.showResult : COPY.next) + '</button>' +
    '</div></section>'
  );
}

// ---- 결과 화면 (UserView만 사용) -----------------------------------------------------------
const ICON = { target: '●', unknown: '▲', neutral: '○', error: '■' };

function badge(tone, text) {
  return '<span class="badge tone-' + esc(tone) + '"><span aria-hidden="true">' + ICON[tone] + '</span> ' + esc(text) + '</span>';
}

function basisBlock(list) {
  if (!list || !list.length) return '';
  const items = list
    .map((b) => {
      if (b.missing) return '<li><p>' + esc(b.message) + '</p></li>';
      const meta = [b.effectiveDate ? '시행일 ' + b.effectiveDate : '', b.noticeNo ? '고시 ' + b.noticeNo : '', b.reliabilityLabel || '']
        .filter(Boolean)
        .join(' · ');
      return '<li><strong>' + esc(b.statute) + '</strong><p>' + esc(b.text) + '</p>' + (meta ? '<p class="muted">' + esc(meta) + '</p>' : '') + '</li>';
    })
    .join('');
  return '<details class="basis"><summary>' + esc(COPY.basisToggle) + '</summary><ul>' + items + '</ul></details>';
}

function moduleCard(m) {
  if (m.display === 'NOT_APPLICABLE') {
    return '<article class="card tone-neutral"><h4>' + esc(m.label) + '</h4><p class="muted">' + esc(m.message) + '</p></article>';
  }
  return (
    '<article class="card tone-' + esc(m.tone) + '"><h4>' + esc(m.label) + '</h4><p>' + badge(m.tone, m.resultLabel) + '</p>' +
    (m.display === 'PRECONDITION' ? '<p class="muted">' + esc(m.message) + '</p>' : '') + basisBlock(m.basis) + '</article>'
  );
}

function m4Card(m4) {
  let inner = '<h4>' + esc(m4.label) + '</h4><p>' + badge(m4.tone, m4.resultLabel) + '</p>';
  if (m4.unresolvedLines) {
    inner += '<div class="callout tone-unknown">' + m4.unresolvedLines.map((l) => '<p>' + esc(l) + '</p>').join('') + '</div>';
  }
  for (const p of m4.paths) {
    inner += '<div class="path"><h5>' + esc(p.label) + '</h5><p>' + badge(p.tone, p.resultLabel) + '</p>';
    if (p.rows.length) {
      inner += '<ul class="rows">' + p.rows.map((r) => '<li><span>' + esc(r.label) + '</span>' + badge(r.tone, r.stateLabel) + '</li>').join('') + '</ul>';
    }
    inner += '</div>';
  }
  if (m4.inactivePaths.length) inner += '<p class="muted">' + esc(m4.inactiveMessage) + ': ' + esc(m4.inactivePaths.join(', ')) + '</p>';
  inner += basisBlock(m4.basis);
  return '<article class="card tone-' + esc(m4.tone) + '">' + inner + '</article>';
}

function formatCreatedAt(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function renderResult(view) {
  const h = view.headline;
  let out = '<section class="screen result" aria-labelledby="step-title"><p class="stepno">' + esc(COPY.stepLabel(6)) + '</p>';
  out += '<div class="headline tone-' + esc(h.tone) + '" aria-live="polite"><span class="ico" aria-hidden="true">' + ICON[h.tone] + '</span><div>' +
    '<h2 id="step-title" tabindex="-1">' + esc(h.text) + '</h2>' + (h.subtitle ? '<p class="sub">' + esc(h.subtitle) + '</p>' : '') + '</div></div>';
  if (view.footer.versionBanner) out += '<p class="callout tone-unknown" role="status">' + esc(view.footer.versionBanner) + '</p>';
  if (view.workTypeLabel) out += '<p class="muted">' + esc(view.workTypeLabel) + '</p>';

  if (view.confirmItems.length) {
    out += '<section class="block tone-unknown"><h3>' + esc(COPY.confirmTitle) + '</h3><ul class="confirm">' +
      view.confirmItems
        .map((i) =>
          '<li><span>' + esc(i.text) + '</span>' +
          (i.kind === 'INPUT' ? ' <button type="button" class="link" data-action="goto-target" data-target="' + esc(i.target) + '">' + esc(COPY.editInput) + '</button>' : '') + '</li>'
        )
        .join('') + '</ul></section>';
  }
  if (view.targetModules.length) {
    out += '<section class="block"><h3>' + esc(COPY.targetBasisTitle) + '</h3><ul>' +
      view.targetModules.map((t) => '<li>' + esc(t.label) + (t.equipment.length ? ' — ' + esc(t.equipment.join(', ')) : '') + '</li>').join('') + '</ul></section>';
  }
  out += '<section class="block"><h3>' + esc(COPY.detailTitle) + '</h3>' + view.modules.map(moduleCard).join('') + m4Card(view.m4) + '</section>';
  if (view.footer.createdAt) out += '<p class="muted">' + esc(COPY.createdAt) + ': ' + esc(formatCreatedAt(view.footer.createdAt)) + '</p>';
  out += '<p class="scope">' + esc(COPY.scope) + '</p>';
  out += '<div class="nav"><button type="button" class="btn" data-action="edit">' + esc(COPY.editInput) + '</button>' +
    '<button type="button" class="btn" data-action="restart">' + esc(COPY.restart) + '</button></div></section>';
  return out;
}

module.exports = { esc, renderWizard, renderResult, formatCreatedAt };

},
'./app.js': function (module, exports, require) {
/**
 * app.js — 컨트롤러 (UI-DESIGN.md §1)
 *
 *   Wizard(상태) → buildEngineInput → [evaluate] → Snapshot → buildReportModel → toUserView → Renderer
 *
 * - `evaluate()`를 호출하는 곳은 이 파일(runEvaluation)뿐이다. Wizard·Renderer·Report는 호출하지 않는다.
 * - 컨트롤러가 INDUSTRY_LIST·LAW_BASIS·현재 ruleVersion을 읽어 UI/Report에 인자로 전달한다.
 * - 판정·임계값 비교·보정 로직을 두지 않는다(OPEN-ISSUE-ENGINE-M4-CHEM-EXCLUSION-UNKNOWN 보정 금지 포함).
 * - 상태는 인메모리다(브라우저 저장소 미사용).
 */
'use strict';

const engine = require('./engine.js');
const { LAW_BASIS, INDUSTRY_LIST } = require('./law-basis.js');
const { buildReportModel, toUserView } = require('./report.js');
const model = require('./ui-model.js');
const render = require('./ui-render.js');

function createDeps(overrides) {
  return Object.assign(
    {
      evaluate: engine.evaluate,
      lawBasis: LAW_BASIS,
      industryList: INDUSTRY_LIST,
      currentRuleVersion: engine.RULE_VERSION,
      now: () => new Date().toISOString(),
    },
    overrides || {}
  );
}

/** 상태 → (Engine 입력, Snapshot, ReportModel, UserView). 판정은 Engine만 한다. */
function runEvaluation(state, deps) {
  const input = model.buildEngineInput(state);
  const snapshot = deps.evaluate(input, { now: deps.now() });
  const reportModel = buildReportModel(snapshot, deps.lawBasis, { currentRuleVersion: deps.currentRuleVersion });
  const userView = toUserView(reportModel);
  return { input, snapshot, reportModel, userView };
}

function setPath(obj, path, value) {
  const keys = path.split('.');
  let o = obj;
  for (let i = 0; i < keys.length - 1; i++) o = o[keys[i]];
  o[keys[keys.length - 1]] = value;
}

function mount(root, deps) {
  const d = deps || createDeps();
  let state = model.initialState();
  let userView = null;

  function draw(opts) {
    const o = opts || {};
    const active = typeof document !== 'undefined' ? document.activeElement : null;
    const keepId = o.keepFocus && active && active.id ? active.id : null;
    root.innerHTML = state.step === 'result' ? render.renderResult(userView) : render.renderWizard(state, { industryList: d.industryList });
    let el = null;
    if (o.focus === 'errsum') el = document.getElementById('errsum');
    else if (o.focus === 'title') el = document.getElementById('step-title');
    else if (keepId) el = document.getElementById(keepId);
    if (el && el.focus) el.focus();
  }

  function goto(step, opts) {
    state.step = step;
    state.errors = [];
    draw(opts || { focus: 'title' });
    if (typeof window !== 'undefined' && window.scrollTo) window.scrollTo(0, 0);
  }

  function next() {
    const step = state.step;
    const errs = model.validateStep(state, step);
    if (errs.length) {
      state.errors = errs;
      draw({ focus: 'errsum' });
      return;
    }
    const steps = model.stepsFor(state);
    const nextStep = steps[steps.indexOf(step) + 1];
    if (!nextStep) return;
    if (nextStep === 'result') userView = runEvaluation(state, d).userView;
    goto(nextStep);
  }

  function prev() {
    const steps = model.stepsFor(state);
    const i = steps.indexOf(state.step);
    if (i > 0) goto(steps[i - 1]);
  }

  function toggleEquip(key, checked) {
    const e = state.equip;
    if (key === 'none' || key === 'unknown') {
      e[key] = checked;
      if (checked) {
        for (const id of model.EQUIP_IDS) e.selected[id] = false;
        e[key === 'none' ? 'unknown' : 'none'] = false;
      }
    } else {
      e.selected[key] = checked;
      if (checked) {
        e.none = false;
        e.unknown = false;
      }
    }
    state.errors = [];
  }

  root.addEventListener('click', (ev) => {
    const t = ev.target.closest ? ev.target.closest('[data-action]') : null;
    if (!t) return;
    const a = t.getAttribute('data-action');
    if (a === 'equip-toggle') return; // change 이벤트에서 처리
    if (a === 'start') goto('workType');
    else if (a === 'next') next();
    else if (a === 'prev') prev();
    else if (a === 'edit') goto('workType');
    else if (a === 'restart') {
      state = model.initialState();
      userView = null;
      goto('start');
    } else if (a === 'goto-target') goto(model.stepForTarget(state, t.getAttribute('data-target')));
    else if (a === 'focus-field') {
      ev.preventDefault();
      const c = document.getElementById(t.getAttribute('data-id'));
      const f = c && (c.matches('input,select') ? c : c.querySelector('input:not([disabled]),select:not([disabled])'));
      if (f) f.focus();
    }
  });

  root.addEventListener('input', (ev) => {
    const t = ev.target;
    const p = t.getAttribute && t.getAttribute('data-path');
    if (p && t.type === 'text') setPath(state, p, t.value); // 텍스트 입력은 재렌더 없이 상태만 갱신(포커스 유지)
  });

  root.addEventListener('change', (ev) => {
    const t = ev.target;
    if (t.getAttribute('data-action') === 'equip-toggle') {
      toggleEquip(t.getAttribute('data-key'), t.checked);
      draw({ keepFocus: true });
      return;
    }
    const p = t.getAttribute('data-path');
    if (!p || t.type === 'text') return;
    if (t.type === 'checkbox') {
      setPath(state, p, t.checked);
      if (t.checked && /\.unknown$/.test(p)) setPath(state, p.replace(/\.unknown$/, '.value'), ''); // "모름"이면 입력값 비움
    } else {
      setPath(state, p, t.value);
    }
    if (p === 'workType') state.errors = [];
    draw({ keepFocus: true });
  });

  root.addEventListener('keydown', (ev) => {
    // 키보드 편의: 숫자 입력칸에서 Enter = 다음
    if (ev.key === 'Enter' && ev.target.type === 'text' && state.step !== 'start' && state.step !== 'result') {
      ev.preventDefault();
      next();
    }
  });

  draw({});
  return { getState: () => state };
}

module.exports = { createDeps, runEvaluation, mount };

if (typeof document !== 'undefined' && document.getElementById) {
  const root = document.getElementById('app');
  if (root) mount(root);
}

}
};
var cache = {};
function req(name) {
  var key = name.indexOf('./') === 0 ? name : './' + name;
  if (!/\.js$/.test(key)) key += '.js';
  if (cache[key]) return cache[key].exports;
  if (!defs[key]) throw new Error('module not found: ' + name);
  var m = { exports: {} };
  cache[key] = m;
  defs[key].call(m.exports, m, m.exports, req);
  return m.exports;
}
req('./app.js');
})();
</script>
</body>
